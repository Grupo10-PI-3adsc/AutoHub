name: Docker Push

on:
  push:
    branches: [ prod ]
  pull_request:
    branches: [ prod ]

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6.18.0
        with:
          context: front_end/react/  # This tells the action to look for the Dockerfile in the root of the repository
          push: true # This tells the action to push the image to Docker Hub
          tags: | # Define as tags para a imagem
            matteusnogueira/autohub-front:latest
            matteusnogueira/autohub-front:${{ github.sha_short }}
